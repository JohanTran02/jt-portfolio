prepare-commit-msg:
  commands:
    commitzen:
      skip:
        - rebase
      interactive: true
      run: exec < /dev/tty && bunx cz --hook || true
      env:
        LEFTHOOK: "0"

commit-msg:
  commands:
    "lint commit message":
      run: bunx commitlint --edit {1}

pre-commit:
  commands:
    lint:
      run: bunx ultracite fix --type-aware --type-check --no-error-on-unmatched-pattern {staged_files}
      glob: "**/*.{js,jsx,ts,tsx,json,jsonc,css}"
      stage_fixed: true