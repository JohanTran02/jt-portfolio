name: autofix.ci

on:
  pull_request:
    branches:
      - "main"
      - "!renovate/**"
  merge_group:

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        env:
          LEFTHOOK: 0
      - run: bun ci
      - run: bunx ultracite fix --quiet --type-aware --type-check --no-error-on-unmatched-pattern --format=github
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a