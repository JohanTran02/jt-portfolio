- name: "size: XS"
  color: "c3e6cb"
  description: "Extra Small: Trivial fix, typo, or minor tweak (under 1 hour)."

- name: "size: S"
  color: "e2f0d9"
  description: "Small: Quick task or isolated bug fix (1-3 hours)."

- name: "size: M"
  color: "fff3cd"
  description: "Medium: Standard feature or moderate code changes (1-2 days)."

- name: "size: L"
  color: "ffe5d0"
  description: "Large: Complex feature or large refactor (3-5 days)."

- name: "size: XL"
  color: "f8d7da"
  description: "Extra Large: Massive effort, epic, or cross-team project (1+ weeks)."

- name: "priority: critical"
  color: "b60205"
  description: "Critical blocks or system failures requiring immediate intervention."

- name: "priority: high"
  color: "d93f0b"
  description: "High importance items that should be prioritized in the current cycle."

- name: "priority: medium"
  color: "fbca04"
  description: "Standard backlog items to be addressed during normal iterations."

- name: "priority: low"
  color: "0e8a16"
  description: "Low urgency tasks or minor tweaks to be handled when time permits."

- name: "status: backlog"
  color: "cfd3d7"
  description: "Items logged and awaiting grooming or scheduling for future work."

- name: "status: can't reproduce"
  color: "fec1c1"
  description: "Reported issues that cannot be replicated after testing."

- name: "status: confirmed"
  color: "215cea"
  description: "Verified bugs or approved requests ready for implementation."

- name: "status: in-progress"
  color: "84b6eb"
  description: "Active tasks currently being developed, reviewed, or tested."

- name: "status: needs information"
  color: "fef2c0"
  description: "Further information is requested from the reporter or stakeholder."

- name: "status: wontfix"
  color: "eeeeee"
  description: "This will not be worked on."

- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working."

- name: "type: documentation"
  color: "006b75"
  description: "Improvements or additions to documentation."

- name: "type: duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists."

- name: "type: epic"
  color: "3E4B9E"
  description: "A theme of work that contain sub-tasks."

- name: "type: feature"
  color: "3dadff"
  description: "New feature or request."

- name: "type: question"
  color: "d876e3"
  description: "Further information is requested."

- name: "type: user story"
  color: "7057ff"
  description: "Requirements expressed from the perspective of an end-user."

- name: "ci/cd: workflow"
  color: "000000"
  description: "Automated build, test, and deployment configurations."