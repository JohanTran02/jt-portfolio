# yaml-language-server: $schema=../../.vscode/labels-schema.json
name: "Feature Request"
description: Create a new ticket for a new feature request
title: "Feature: "
labels: ["type: feature", "status: backlog"]
body:
  - type: textarea
    id: value-proposition
    attributes:
      label: Value Proposition
      description: What problem are you trying to solve? Explain why this feature is needed and who it benefits.
      placeholder: |
        As a [user type], I want [the feature] so that [the benefit/value].
        Currently, I have to...
    validations:
      required: true

  - type: textarea
    id: expected-outcome
    attributes:
      label: Expected Outcome
      description: Describe the desired behavior or how you visualize this feature working. Include mockups or examples if applicable.
      placeholder: |
        When I click X, I expect Y to happen...
    validations:
      required: true

  - type: textarea
    id: related-issues
    attributes:
      label: Related Issues
      description: Are there any existing issues, pull requests, or discussions related to this request?
      placeholder: e.g., #123, #456, or links to discussions.
    validations:
      required: false

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Please choose the size of this issue.
      multiple: false
      options:
        - "XS"
        - "S"
        - "M"
        - "L"
        - "XL"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Please choose the priority of the impact of this issue.
      multiple: false
      options:
        - "Low"
        - "Medium"
        - "High"
        - "Critical"
    validations:
      required: false

  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false